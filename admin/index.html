<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Admin | Pátria Vermelha</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/admin/admin.js" defer></script>
  </head>
  <body>
    <div class="admin-background" aria-hidden="true">
      <video class="admin-background-video" autoplay muted loop playsinline preload="metadata">
        <source src="/ssstwitter.com_1791476129925.mp4" type="video/mp4" />
      </video>
      <div class="admin-background-shade"></div>
    </div>
    <header class="admin-topbar">
      <a class="admin-brand" href="/" aria-label="Pátria Vermelha, página inicial">
        <span class="brand-mark" aria-hidden="true">☭</span>
        <span>Pátria Vermelha</span>
      </a>
      <span class="language-label"><span aria-hidden="true">🇧🇷</span> PT</span>
    </header>

    <main class="admin-main">
      <section class="login-panel" id="login-view" hidden>
        <p class="eyebrow">ACESSO RESTRITO</p>
        <h1>Publicar no portal</h1>
        <p class="login-copy">Entre com a conta X autorizada para administrar as publicações.</p>
        <a class="x-login" href="/api/auth/x/start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L5.5 22H2.3l7.3-8.4L1.8 2h6.5l4.4 6.9L18.9 2Zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20Z" fill="currentColor" /></svg>
          Entrar com X
          <span aria-hidden="true">↗</span>
        </a>
        <p class="login-status" id="login-status" role="status"></p>
      </section>

      <section class="workspace" id="workspace" hidden>
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">REDAÇÃO</p>
            <h1>Publicações</h1>
          </div>
          <div class="user-session">
            <span id="user-label"></span>
            <button class="logout-button" id="logout-button" type="button">Sair</button>
          </div>
        </div>

        <section class="composer" aria-labelledby="composer-title">
          <div class="composer-heading">
            <h2 id="composer-title">Nova publicação</h2>
            <span>Sem limite de caracteres</span>
          </div>
          <div class="editor-toolbar" role="toolbar" aria-label="Formatação do texto">
            <button type="button" data-command="bold" aria-label="Negrito"><strong>B</strong></button>
            <button type="button" data-command="italic" aria-label="Itálico"><em>I</em></button>
            <button type="button" data-command="underline" aria-label="Sublinhado"><u>U</u></button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button type="button" data-command="insertUnorderedList" aria-label="Lista com marcadores">• Lista</button>
            <button type="button" data-command="formatBlock" data-value="blockquote" aria-label="Citação">Citação</button>
            <button type="button" id="link-button">Link</button>
            <label class="color-control" title="Cor do texto">
              <span aria-hidden="true">A</span>
              <input id="text-color" type="color" value="#c3423f" aria-label="Cor do texto" />
            </label>
            <label class="media-control" for="media-file">
              <span aria-hidden="true">＋</span> Mídia
            </label>
            <input id="media-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" hidden />
          </div>
          <div class="editor" id="post-editor" contenteditable="true" role="textbox" aria-label="Texto da publicação" aria-multiline="true" data-placeholder="O que está acontecendo?"></div>
          <div class="composer-footer">
            <p class="composer-status" id="composer-status" role="status"></p>
            <button class="publish-button" id="publish-button" type="button">Publicar agora <span aria-hidden="true">↗</span></button>
          </div>
        </section>

        <section class="posts-section" aria-labelledby="posts-title">
          <div class="posts-heading">
            <h2 id="posts-title">No portal</h2>
            <button class="refresh-button" id="refresh-button" type="button" aria-label="Atualizar publicações">Atualizar</button>
          </div>
          <div class="posts-list" id="posts-list" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </body>
</html>
